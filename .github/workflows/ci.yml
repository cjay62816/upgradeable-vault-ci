name: Vault CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install
          
      - name: Run tests
        run: npm test
        
      - name: Lint frontend
        run: cd frontend && npm run lint
        
      - name: Build frontend
        run: cd frontend && npm run build

  test-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.1.0

      - name: Run Foundry tests
        run: |
          forge install
          forge build
          forge test --gas-report

      - name: Export ABI for frontend
        run: |
          mkdir -p frontend/src/abi
          forge inspect src/MyVaultV3.sol:VaultV1 abi --json > frontend/src/abi/VaultV1.json

    