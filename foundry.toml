[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Libraries from other packaging systems (like npm) can be aliased
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/"
]

# Enable static analyzer
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
func_attrs_with_params_multiline = true
quote_style = "double"
number_underscore = "preserve"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[profile.default.env]
PRIVATE_KEY = "${PRIVATE_KEY}"
SEPOLIA_RPC_URL = "${SEPOLIA_RPC_URL}"
ETHERSCAN_API_KEY = "${ETHERSCAN_API_KEY}"

[profile.sepolia]
chain_id = 11155111
eth_rpc_url = "${SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md 